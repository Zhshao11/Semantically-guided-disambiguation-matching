[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdgm"
version = "0.1.0"
description = "Structural coarse retrieval and data validation for optical-SAR matching"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "Pillow>=10", "rasterio>=1.3", "pyproj>=3.5"]

[project.optional-dependencies]
test = ["pytest>=8", "torch>=2.0", "shapely>=2.0"]
smoke = ["torch>=2.0", "matplotlib>=3.7"]
raw = ["shapely>=2.0", "gdown>=5.0"]

[tool.setuptools.packages.find]
include = ["sdgm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
